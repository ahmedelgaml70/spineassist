name: Build anatomy PPT

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg python3-numpy

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Download complete anatomy model
        run: bash scripts/download_model.sh

      - name: Verify Blender can import NumPy
        run: blender -b --python-expr "import numpy; print('Blender NumPy OK:', numpy.__version__)"

      - name: Render motion clips from complete model
        run: |
          set -euo pipefail
          blender -b --python scripts/render_motion_blender.py
          test -f outputs/shoulder_flexion_from_complete_model.mp4
          test -f outputs/shoulder_abduction_from_complete_model.mp4
          test -f outputs/shoulder_flexion_from_complete_model_poster.png
          test -f outputs/shoulder_abduction_from_complete_model_poster.png

      - name: Build PPTX
        run: |
          set -euo pipefail
          node scripts/build_ppt.js
          test -f outputs/anatomy_motion_pilot.pptx

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-motion-pilot
          path: |
            outputs/anatomy_motion_pilot.pptx
            outputs/*.mp4
            outputs/*.png
            outputs/model_manifest.json
