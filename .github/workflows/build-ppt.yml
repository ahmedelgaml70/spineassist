name: Build anatomy PPT

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl xz-utils libegl1 libxrender1 libxi6 libxkbcommon0 libsm6 libxrandr2 libxinerama1 libxcursor1

      - name: Install official Blender bundle
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender4.0/blender-4.0.2-linux-x64.tar.xz
          mkdir -p blender-dist
          tar -xf blender.tar.xz -C blender-dist --strip-components=1
          ./blender-dist/blender -b --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Download complete anatomy model
        run: bash scripts/download_model.sh

      - name: Verify official Blender import dependencies
        run: ./blender-dist/blender -b --python-expr "import numpy; print('Blender NumPy OK:', numpy.__version__)"

      - name: Render motion clips from complete model
        run: |
          set -euo pipefail
          ./blender-dist/blender -b --python scripts/render_motion_blender_clean.py
          test -f outputs/shoulder_flexion_from_complete_model.mp4
          test -f outputs/shoulder_abduction_from_complete_model.mp4
          test -f outputs/shoulder_flexion_from_complete_model_poster.png
          test -f outputs/shoulder_abduction_from_complete_model_poster.png
          node -e 'const m=require("./outputs/model_manifest.json"); if(!m.pipeline_qa?.hierarchy_contact_preserved) throw new Error("shoulder hierarchy/contact QA missing or failed"); console.log(JSON.stringify(m.pipeline_qa,null,2))'

      - name: Build PPTX
        run: |
          set -euo pipefail
          node scripts/build_ppt.js
          test -f outputs/anatomy_motion_pilot.pptx

      - name: Audit generated outputs
        run: |
          set -euo pipefail
          python3 scripts/audit_outputs.py
          test -f outputs/audit_summary.json

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-motion-pilot
          path: |
            outputs/anatomy_motion_pilot.pptx
            outputs/*.mp4
            outputs/*.png
            outputs/model_manifest.json
            outputs/audit_summary.json
